<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme.css">
</helmet>
<div style="width: 354px; height: 792px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; font-variant-numeric: tabular-nums">

  <div style="flex-shrink: 0; padding: 40px 8px 0; display: grid; grid-template-columns: 88px minmax(0, 1fr) 88px; align-items: center">
    <a href="Main.dc.html" style="padding: 12px 8px; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 2px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>Home</a>
    <div style="text-align: center; font-size: 15px; font-weight: 600">Settings</div>
    <span></span>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 22px">

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--text-secondary)">APPEARANCE</h2>
      <div style="background: var(--surface); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="padding: 2px; border-radius: 10px; background: var(--segment-track); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))" role="radiogroup" aria-label="Theme">
          <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
            <button onClick="{{m.pick}}" role="radio" aria-checked="{{m.on}}" style="height: 36px; border: 0; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; background: {{m.bg}}; color: {{m.fg}}">{{m.label}}</button>
          </sc-for>
        </div>
        <div style="font-size: 12px; color: var(--text-tertiary)">{{modeNote}}</div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--text-secondary)">ACCOUNTS</h2>
      <div style="background: var(--surface); border-radius: 14px; display: flex; flex-direction: column">
        <sc-for list="{{accounts}}" as="a" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-bottom: 1px solid var(--separator)">
            <span style="width: 30px; height: 20px; border-radius: 4px; flex-shrink: 0; background: {{a.swatch}}"></span>
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.name}}</div>
              <div style="font-size: 12px; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.kind}}</div>
            </div>
            <div style="text-align: right">
              <div style="font-size: 14px; font-weight: 600; white-space: nowrap">{{a.amount}}</div>
              <div style="font-size: 11px; color: var(--text-tertiary)">{{a.label}}</div>
            </div>
          </div>
        </sc-for>
        <button style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border: 0; background: transparent; color: var(--link); font-size: 14px; font-weight: 600; cursor: pointer; text-align: left">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add account</button>
      </div>
      <div style="margin: 0 4px; font-size: 12px; color: var(--text-tertiary)">Credit card and pay-later balances are amounts owed. Set the statement and due day on each.</div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--text-secondary)">CATEGORIES</h2>
        <a href="#" style="font-size: 13px">Edit</a>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
          <span style="height: 34px; padding: 0 14px; border-radius: 17px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; background: var(--fill); border: 1px solid var(--chip-border)">{{c}}</span>
        </sc-for>
        <span style="height: 34px; padding: 0 14px; border-radius: 17px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; border: 1px dashed var(--chip-border); color: var(--text-secondary)">+ Add</span>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--text-secondary)">AI</h2>
      <div style="background: var(--surface); border-radius: 14px; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 14px; border-bottom: 1px solid var(--separator)">
          <span style="font-size: 14px">Provider</span>
          <span style="font-size: 14px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px">Gemini <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 14px">
          <span style="font-size: 14px">API key</span>
          <span style="font-size: 14px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px">Saved <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></span>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--text-secondary)">SIGNED IN</h2>
      <div style="background: var(--surface); border-radius: 14px; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 14px; border-bottom: 1px solid var(--separator)">
          <span style="font-size: 14px">Guan Cheng</span>
          <span style="font-size: 13px; color: var(--text-tertiary)">This phone only</span>
        </div>
        <button style="min-height: 48px; padding: 0 14px; border: 0; background: transparent; color: var(--danger); font-size: 14px; font-weight: 600; text-align: left; cursor: pointer">Log out</button>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":354,"height":792}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: document.documentElement.dataset.theme };
  }
  renderVals() {
    const s = this.state;
    const modes = [['system', 'System'], ['light', 'Light'], ['dark', 'Dark']].map(([id, label]) => {
      const on = s.mode === id;
      return {
        label, on,
        bg: on ? 'var(--segment-thumb)' : 'transparent',
        fg: on ? 'var(--text)' : 'var(--text-secondary)',
        pick: () => {
          const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = id === 'system' ? (dark ? 'dark' : 'light') : id;
          this.setState({ mode: id });
        },
      };
    });
    const accounts = [
      { name: 'Savings account', kind: 'Bank', amount: 'RM3,912.40', label: 'Balance', swatch: 'var(--card-bank)' },
      { name: 'Cash', kind: 'Wallet', amount: 'RM395.30', label: 'Balance', swatch: 'var(--card-cash)' },
      { name: 'Credit card', kind: 'Statement 25 · due 15', amount: 'RM0.00', label: 'Owed', swatch: 'var(--card-credit)' },
      { name: 'SPayLater', kind: 'Statement 20 · due month-end', amount: 'RM498.50', label: 'Owed', swatch: 'var(--card-spl)' },
    ];
    const cats = ['Food', 'Groceries', 'Transport', 'Shopping', 'Bills', 'Health', 'Entertainment', 'Other'];
    const modeNote = s.mode === 'system' ? 'Follows your phone’s dark-mode setting.' : 'Always ' + s.mode + ', whatever your phone is set to.';
    return { modes, accounts, cats, modeNote };
  }
}
</script>
</body>
</html>
